[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goodai-metrics"
version = "0.1.0"
description = "CLI tool for analyzing AI implementation metrics against industry benchmarks"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Good AI", email = "contact@wearegoodai.com"}
]
keywords = ["ai", "metrics", "cli", "benchmarks", "analytics", "enterprise"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
]
reports = [
    "reportlab>=4.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "build>=1.0",
    "twine>=4.0",
    "httpx>=0.24.0",  # For testing FastAPI
    "reportlab>=4.0.0",  # For testing PDF reports
]
all = [
    "goodai-metrics[server,reports,dev]",
]

[project.scripts]
goodai-metrics = "goodai_metrics.cli:main"

[project.urls]
Homepage = "https://github.com/GoodAI-Global/ai-metrics-cli"
Documentation = "https://github.com/GoodAI-Global/ai-metrics-cli#readme"
Repository = "https://github.com/GoodAI-Global/ai-metrics-cli"
Issues = "https://github.com/GoodAI-Global/ai-metrics-cli/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
goodai_metrics = ["../benchmarks/*.json", "../sample_data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]  # Line length handled by black

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
